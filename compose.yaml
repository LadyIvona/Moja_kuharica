services:
  postgres:
    image: postgres:17-alpine
    container_name: recepti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes_dev
    ports:
      - "5432:5432"
    volumes:
      - recipe-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recipe-data:
